<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>RDP · Structural Biology Research Data Platform</title>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    const base = 'https://raw.githubusercontent.com/erikem/Test3DGame/main/rdp-v18-deploy/';
    const files = ['00.txt','01.txt','02.txt','03.txt','04.txt','05.txt','06.txt'];
    const parts = await Promise.all(files.map(async (name) => {
      const response = await fetch(base + name, { cache: 'no-store' });
      if (!response.ok) throw new Error(`Failed to load ${name}: ${response.status}`);
      return response.text();
    }));
    const b64 = parts.join('');
    const raw = atob(b64);
    const bytes = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
    const text = await new Response(
      new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))
    ).text();
    const marker = '\n/*__RDP_PAYLOAD_SPLIT__*/\n';
    const splitAt = text.indexOf(marker);
    if (splitAt < 0) throw new Error('Invalid RDP payload');
    const style = document.createElement('style');
    style.textContent = text.slice(0, splitAt);
    document.head.appendChild(style);
    const moduleUrl = URL.createObjectURL(new Blob([
      text.slice(splitAt + marker.length)
    ], { type: 'text/javascript' }));
    await import(moduleUrl);
  </script>
</body>
</html>
